<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>LED行先表示シミュレーター</title>
<style>
  body { background: #333; color: white; font-family: sans-serif; padding: 20px; }
  select { font-size: 16px; padding: 8px; margin: 5px; }
  .led-board {
    display: inline-flex;
    background-color: #000;
    border: 8px solid #555;
    border-radius: 6px;
    padding: 6px;
    margin-top: 15px;
  }
  .right-column { display: flex; flex-direction: column; }
  .led-board img { display: block; image-rendering: pixelated; }
  #img-type { height: 96px; }
  #img-dest { height: 48px; }
  #img-next { height: 48px; }
</style>
</head>
<body>

  <div>
    

    <select id="typeSelect" onchange="updateLED()">
      <option value="普通">種別：普通</option>
    </select>

    <select id="destSelect" onchange="updateLED()">
      <option value="万座・鹿沢口">行先：万座・鹿沢口</option>
      <option value="大前">行先：大前</option>
    </select>

    <select id="nextSelect" onchange="updateLED()">
      <option value="次は 袋倉">次駅：次は 袋倉</option>
    </select>
  </div>

  <div class="led-board">
    <img id="img-type" src="" alt="種別">
    <div class="right-column">
      <img id="img-dest" src="" alt="行先">
      <img id="img-next" src="" alt="次駅">
    </div>
  </div>

<script>
  // ★ここにGitHubにアップした実際の画像ファイル名を入れてください
  const partImages = {
    "普通": "futsu.png",
    "万座・鹿沢口": "for manzakazawaguchi japanese.png",
    "大前": "for omae japanese.png",
    "次は 袋倉": "next hukurogura japanese.png",
   
  };

  function selectPreset() {
    const val = document.getElementById("presetSelect").value;
    if (!val) return;
    // 角カッコを使わずに3つに分解する安全な書き方
    const parts = val.split("|");
    document.getElementById("typeSelect").value = parts.at(0);
    document.getElementById("destSelect").value = parts.at(1);
    document.getElementById("nextSelect").value = parts.at(2);
    updateLED();
  }

  function updateLED() {
    const typeName = document.getElementById("typeSelect").value;
    const destName = document.getElementById("destSelect").value;
    const nextName = document.getElementById("nextSelect").value;

    document.getElementById("img-type").src = partImages[typeName];
    document.getElementById("img-dest").src = partImages[destName];
    
    const nextImg = document.getElementById("img-next");
    if (nextName === "なし" && !partImages["なし"]) {
      nextImg.style.visibility = "hidden";
    } else {
      nextImg.style.visibility = "visible";
      nextImg.src = partImages[nextName];
    }
  }

  updateLED();
</script>

</body>
</html>
